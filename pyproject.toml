[project]
name = "causalops"
version = "1.0.3"
description = "Evidence-grounded incident investigator for a local synthetic lab"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "psutil>=6",
    "pydantic>=2",
    # LangGraph's StateGraph drives investigation orchestration (graph.py);
    # langchain-core supplies the shared message/tool-call types it and the
    # live Claude adapter both build on.
    "langgraph>=0.2",
    "langchain-core>=0.3",
    # The durable checkpoint backend `cli.py` wires through `SqliteSaver`.
    # Pulls in `aiosqlite` and `sqlite-vec` transitively -- this package
    # bundles an async saver and a vector-search extension neither of which
    # CausalOps uses; only the synchronous `SqliteSaver` is called anywhere
    # in this codebase.
    "langgraph-checkpoint-sqlite>=3.1",
    # The live Claude adapter (`live_model.py`, behind `ChatAnthropic`). Pulls
    # in `anthropic`, `httpx`, `docstring-parser`, and `jiter` transitively --
    # audited for network activity at import time. `tests/security/test_no_tracing.py`'s
    # `test_importing_causalops_cli_never_sends_a_tracing_request` proves
    # this directly, in a fresh subprocess with the refusal monkeypatches
    # installed *before* `causalops.cli` is ever imported. That file's two
    # `..._through_the_cli_entry_point` tests prove a narrower, separate
    # claim -- that *running* a replay investigation through `cli.main`
    # sends nothing either -- since `from causalops import cli` there runs
    # at collection time, before either test's own monkeypatch installs;
    # the import itself stays safe only because `tests/conftest.py`'s
    # network guard is already active for the whole pytest session by then.
    "langchain-anthropic>=1.6.1",
]

[project.scripts]
causalops = "causalops.cli:main"
# A genuinely separate binary, not a `causalops` subcommand:
# `causalops.cli` never imports `causalops.evaluate_cli`, and this module
# never imports `causalops.cli` -- `tests/security/test_evaluate_cli_isolation.py`
# proves the first half directly. A hyphenated name because a
# `[project.scripts]` key becomes an executable filename on `PATH`, which
# cannot contain a space.
causalops-evaluate = "causalops.evaluate_cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/causalops"]

[dependency-groups]
dev = [
    "mypy>=1.11",
    # The lab services need this inside their image; it is here so their unit tests
    # can import them on the host. lab/services/Dockerfile pins the same version.
    "prometheus-client>=0.21",
    "pytest>=8",
    "pyyaml>=6",
    "ruff>=0.6",
    "types-psutil>=6",
    "types-pyyaml>=6",
]

[tool.ruff]
line-length = 88
src = ["src", "lab", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["lab/services", "tests/unit"]
markers = ["docker: needs the local lab containers"]
