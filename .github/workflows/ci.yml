name: checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    # All three platforms run the same five commands. Windows and macOS
    # support are proven here rather than by a manual run, since work
    # happens on Linux -- these three are GitHub's free hosted runner
    # options, not a set `doctor` itself restricts to (it no longer does).
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.10"
      # Installing the locked dependencies is the only step that uses the network.
      - run: uv sync --locked
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy src lab
      # The lab containers are not started in CI on any platform, so their
      # integration tests are deselected and the owner runs them by hand.
      - run: uv run pytest -m "not docker"
