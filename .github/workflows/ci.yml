name: checks

on:
  push:
  pull_request:

jobs:
  checks:
    # Both supported platforms run the same five commands. Windows support is
    # proven here rather than by a manual run, since work happens on Linux.
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.10.10"
      # Installing the locked dependencies is the only step that uses the network.
      - run: uv sync --locked
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy src lab
      # The lab containers are not started in CI on either platform, so their
      # integration tests are deselected and the owner runs them by hand.
      - run: uv run pytest -m "not docker"
